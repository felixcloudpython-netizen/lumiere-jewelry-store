version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jewelry-db
    environment:
      POSTGRES_USER: jewelry_user
      POSTGRES_PASSWORD: jewelry_pass
      POSTGRES_DB: jewelry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jewelry-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
