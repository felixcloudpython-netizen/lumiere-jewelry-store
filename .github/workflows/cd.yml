name: CD - Deploy to Production

# Đã chuyển hẳn sang Coolify (lấy code qua GitHub App riêng, không qua GitHub
# Actions) — workflow này KHÔNG còn tự chạy khi push nữa (trước đây tự chạy mỗi
# lần push, luôn báo lỗi vì thiếu secret SSH_PRIVATE_KEY/SSH_HOST chưa từng cấu
# hình). Giữ lại file, chỉ chạy khi bấm tay (workflow_dispatch), phòng khi sau
# này cần quay lại đường VPS+SSH thuần.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: []
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh $SSH_USER@$SSH_HOST << 'EOF'
            cd /opt/jewelry-store
            git pull origin main
            cp .env.prod .env
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml build --no-cache
            docker-compose -f docker-compose.prod.yml up -d
            docker-compose -f docker-compose.prod.yml exec -T backend npx prisma migrate deploy
            docker system prune -f
          EOF

      - name: Health check
        run: |
          sleep 30
          curl -f https://${{ secrets.SSH_HOST }}/health || exit 1
          curl -f https://api.${{ secrets.SSH_HOST }}/health || exit 1

      - name: Notify Slack
        # Chỉ chạy khi thực sự có secret này — trước đây "if: always()" khiến
        # bước này LUÔN chạy và LUÔN lỗi cứng vì SLACK_WEBHOOK_URL chưa từng
        # được cấu hình (vốn chỉ là secret optional, không bắt buộc).
        if: always() && secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
