name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jewelry_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jewelry-api-express/package-lock.json

      - name: Install dependencies
        working-directory: ./jewelry-api-express
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./jewelry-api-express
        run: npx prisma generate

      - name: Run migrations
        working-directory: ./jewelry-api-express
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/jewelry_test?schema=public
        run: npx prisma migrate deploy

      - name: Run tests
        working-directory: ./jewelry-api-express
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/jewelry_test?schema=public
          JWT_SECRET: test-secret-key-for-ci-only
          JWT_EXPIRES_IN: 7d
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./jewelry-api-express/coverage/lcov.info
          flags: backend

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jewelry-frontend-nextjs/package-lock.json

      - name: Install dependencies
        working-directory: ./jewelry-frontend-nextjs
        run: npm ci

      - name: Run tests
        working-directory: ./jewelry-frontend-nextjs
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./jewelry-frontend-nextjs/coverage/lcov.info
          flags: frontend

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Backend
        working-directory: ./jewelry-api-express
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Build Frontend
        working-directory: ./jewelry-frontend-nextjs
        run: |
          npm ci
          npm run build
