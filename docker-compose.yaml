version: '3.8'

# Dùng riêng cho deploy qua Coolify — khác với docker-compose.prod.yml (vẫn giữ
# nguyên, dùng cho đường VPS thuần tự quản lý Nginx/SSL bằng tay).
#
# 3 khác biệt so với docker-compose.prod.yml:
# 1. KHÔNG có service `nginx` — Coolify tự có reverse proxy (Traefik/Caddy) lo
#    domain + SSL cho từng service, tự chạy thêm 1 nginx nữa sẽ đụng cổng 80/443.
# 2. KHÔNG có service `redis` — đã xác nhận không có chỗ nào trong code dùng tới
#    (xem ghi chú ở lần rà soát bảo mật đầu tiên), giữ lại chỉ tốn tài nguyên.
# 3. KHÔNG có service `postgres` — dùng Postgres do CHÍNH COOLIFY quản lý (tạo
#    riêng như 1 "Database" resource trong Coolify UI) thay vì tự chạy trong
#    compose, để có backup tự động theo lịch — điều mà cách tự chạy trước đây
#    hoàn toàn không có. `DATABASE_URL` sẽ trỏ tới Postgres đó qua biến môi
#    trường Coolify cấp, không tự ráp chuỗi kết nối từ POSTGRES_USER/PASSWORD/DB
#    như trước nữa.

services:
  backend:
    build:
      context: ./jewelry-api-express
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PORT: 3001
      CLIENT_URL: ${CLIENT_URL}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID}
      PAYOS_API_KEY: ${PAYOS_API_KEY}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    # KHÔNG khai `ports:` — Coolify tự quản lý việc mở cổng ra ngoài qua proxy
    # riêng của nó (gán domain/URL cho từng service ngay trong UI). Khai `ports:`
    # thủ công ở đây dễ xung đột với cơ chế đó (theo khuyến cáo chính thức của
    # Coolify khi dùng Docker Compose build pack).
    #
    # networks: coolify — Database resource (Postgres) trong Coolify tự động
    # nằm trên network `coolify` chung của toàn hệ thống, nhưng 1 "Docker
    # Compose" Application resource như file này lại bị Coolify tách vào 1
    # network RIÊNG theo UUID của chính resource đó. Thiếu dòng này, backend sẽ
    # không bao giờ resolve được tên host Postgres (lỗi "Can't reach database
    # server" dù DATABASE_URL đúng 100%), vì 2 network khác nhau không thấy
    # nhau qua DNS nội bộ Docker.
    networks:
      - coolify
    restart: unless-stopped

  frontend:
    build:
      context: ./jewelry-frontend-nextjs
      dockerfile: Dockerfile
      args:
        # BẮT BUỘC: NEXT_PUBLIC_* phải được truyền ở đây (build time) — Next.js
        # đã bake các biến này vào bundle JS ngay lúc build, set ở `environment:`
        # runtime không có tác dụng. Deploy backend TRƯỚC để có domain Coolify
        # cấp cho backend, rồi mới điền domain đó vào NEXT_PUBLIC_API_URL trước
        # khi build frontend.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    # Không bắt buộc như backend (frontend không gọi database trực tiếp), nhưng
    # thêm cho nhất quán và để phòng trường hợp cần gọi service nội bộ khác sau
    # này.
    networks:
      - coolify
    restart: unless-stopped

# Khai báo network `coolify` là network CÓ SẴN từ trước (do Coolify tự tạo cho
# toàn hệ thống), không phải network mới cần tạo — nếu thiếu `external: true`,
# Docker Compose sẽ cố tạo mới 1 network trùng tên và báo lỗi.
networks:
  coolify:
    external: true
